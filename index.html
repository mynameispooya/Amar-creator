<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدیریت انتقال پرسنل</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <style>
        :root {
            --bg: #08090e;
            --bg-surface: #0f1119;
            --bg-card: #161923;
            --bg-card-hover: #1e2235;
            --bg-input: #111420;
            --accent: #00d4aa;
            --accent-dim: rgba(0,212,170,0.10);
            --accent-glow: rgba(0,212,170,0.35);
            --amber: #f59e0b;
            --amber-dim: rgba(245,158,11,0.10);
            --danger: #ef4444;
            --danger-dim: rgba(239,68,68,0.10);
            --text: #e8eaf0;
            --text-sec: #9ca3af;
            --text-muted: #555a6e;
            --border: #1f2236;
            --border-light: #2b2f48;
            --radius: 14px;
            --radius-sm: 10px;
            --tr: 0.3s cubic-bezier(0.4,0,0.2,1);
        }

        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        html{font-size:16px;-webkit-tap-highlight-color:transparent}
        body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.7}

        /* پس‌زمینه زنده */
        body::before{content:'';position:fixed;top:-30%;right:-10%;width:55vw;height:55vw;background:radial-gradient(circle,rgba(0,212,170,0.05) 0%,transparent 70%);pointer-events:none;z-index:0;animation:fb 22s ease-in-out infinite}
        body::after{content:'';position:fixed;bottom:-20%;left:-10%;width:45vw;height:45vw;background:radial-gradient(circle,rgba(245,158,11,0.035) 0%,transparent 70%);pointer-events:none;z-index:0;animation:fb 28s ease-in-out infinite reverse}
        @keyframes fb{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4%,6%) scale(1.04)}66%{transform:translate(-3%,-4%) scale(0.96)}}

        /* ===== هدر ===== */
        .app-header{position:sticky;top:0;z-index:100;background:rgba(8,9,14,0.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:10px 16px}
        .header-row{display:flex;align-items:center;justify-content:space-between;max-width:1600px;margin:0 auto}
        .app-title{font-size:1.05rem;font-weight:800;color:var(--accent);letter-spacing:-0.5px}
        .header-actions{display:flex;gap:2px;align-items:center}

        .icon-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:none;border-radius:var(--radius-sm);background:transparent;color:var(--text-sec);cursor:pointer;transition:var(--tr);position:relative}
        .icon-btn:hover{background:var(--bg-card);color:var(--text)}
        .icon-btn:active{transform:scale(0.92)}
        .icon-btn .material-icons-round{font-size:21px}

        /* منوی کشویی */
        .dropdown-menu{position:absolute;top:calc(100% + 6px);left:0;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-sm);min-width:210px;padding:5px;z-index:200;box-shadow:0 14px 44px rgba(0,0,0,0.55);opacity:0;transform:translateY(-6px) scale(0.97);pointer-events:none;transition:var(--tr)}
        .dropdown-menu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
        .dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border:none;border-radius:8px;background:transparent;color:var(--text);font-family:'Vazirmatn',sans-serif;font-size:0.82rem;cursor:pointer;transition:var(--tr);width:100%;text-align:right}
        .dropdown-item:hover{background:var(--bg-card-hover)}
        .dropdown-item .material-icons-round{font-size:18px;color:var(--text-sec)}
        .dropdown-item.danger{color:var(--danger)}
        .dropdown-item.danger .material-icons-round{color:var(--danger)}

        /* ===== لایه اصلی دسکتاپ ===== */
        .app-body{display:flex;max-width:1600px;margin:0 auto;min-height:calc(100vh - 58px);position:relative;z-index:1}

        /* ===== سایدبار - لیست اصلی ===== */
        .main-sidebar{width:320px;flex-shrink:0;background:var(--bg-surface);border-left:1px solid var(--border);display:flex;flex-direction:column;height:calc(100vh - 58px);position:sticky;top:58px;overflow:hidden}

        .sidebar-head{padding:16px 16px 12px;border-bottom:1px solid var(--border)}
        .sidebar-title-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
        .sidebar-title-row .material-icons-round{font-size:24px;color:var(--accent)}
        .sidebar-title-row h2{font-size:0.95rem;font-weight:700;flex:1}
        .sidebar-count{background:var(--accent-dim);color:var(--accent);font-weight:800;font-size:0.82rem;padding:3px 12px;border-radius:50px}

        .sidebar-search{display:flex;align-items:center;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 10px;transition:var(--tr)}
        .sidebar-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
        .sidebar-search .material-icons-round{font-size:19px;color:var(--text-muted)}
        .sidebar-search input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'Vazirmatn',sans-serif;font-size:0.85rem;padding:9px 8px}
        .sidebar-search input::placeholder{color:var(--text-muted)}
        .search-clr{width:26px;height:26px;display:none;align-items:center;justify-content:center;border:none;border-radius:50%;background:var(--bg-card);color:var(--text-muted);cursor:pointer}
        .search-clr.vis{display:flex}
        .search-clr .material-icons-round{font-size:16px}

        /* لیست اسامی */
        .sidebar-list{flex:1;overflow-y:auto;padding:8px}
        .sidebar-list::-webkit-scrollbar{width:5px}
        .sidebar-list::-webkit-scrollbar-track{background:transparent}
        .sidebar-list::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}

        .name-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:grab;transition:var(--tr);user-select:none}
        .name-item:hover{background:var(--bg-card-hover);border-color:var(--border-light)}
        .name-item:active{cursor:grabbing}
        .name-item.dragging{opacity:0.4;transform:scale(0.96)}
        .name-item .grip{color:var(--text-muted);font-size:16px;flex-shrink:0}
        .name-item .n-idx{font-size:0.7rem;color:var(--text-muted);font-weight:600;min-width:20px}
        .name-item .n-name{flex:1;font-size:0.85rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

        /* افزودن دستی */
        .sidebar-add{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px}
        .sidebar-add input{flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Vazirmatn',sans-serif;font-size:0.85rem;outline:none;transition:var(--tr)}
        .sidebar-add input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
        .sidebar-add input::placeholder{color:var(--text-muted)}
        .add-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:none;border-radius:8px;background:var(--accent);color:var(--bg);cursor:pointer;transition:var(--tr);flex-shrink:0}
        .add-btn:hover{filter:brightness(1.1);box-shadow:0 4px 16px var(--accent-glow)}
        .add-btn:active{transform:scale(0.93)}
        .add-btn .material-icons-round{font-size:22px}

        /* ===== ناحیه دسته‌بندی‌ها ===== */
        .categories-area{flex:1;padding:20px;overflow-y:auto;height:calc(100vh - 58px)}
        .categories-area::-webkit-scrollbar{width:6px}
        .categories-area::-webkit-scrollbar-track{background:transparent}
        .categories-area::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}

        .cats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

        /* پنل دسته‌بندی */
        .cat-panel{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;min-height:200px;max-height:280px;transition:var(--tr);overflow:hidden}
        .cat-panel:hover{border-color:var(--border-light)}
        .cat-panel.drag-over{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-dim),0 8px 30px rgba(0,212,170,0.1);transform:scale(1.01)}

        .cat-panel-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
        .cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
        .cat-panel-name{font-size:0.85rem;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .cat-panel-cnt{font-size:0.75rem;font-weight:700;padding:2px 10px;border-radius:50px;flex-shrink:0}

        .cat-panel-body{flex:1;overflow-y:auto;padding:8px}
        .cat-panel-body::-webkit-scrollbar{width:4px}
        .cat-panel-body::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:2px}

        .cat-member{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg-surface);border:1px solid var(--border);border-radius:7px;margin-bottom:5px;cursor:grab;transition:var(--tr);user-select:none}
        .cat-member:hover{background:var(--bg-card-hover)}
        .cat-member.dragging{opacity:0.4}
        .cat-member .grip{color:var(--text-muted);font-size:14px;flex-shrink:0}
        .cat-member .m-name{flex:1;font-size:0.82rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

        .cat-empty{text-align:center;padding:24px 12px;color:var(--text-muted);font-size:0.8rem}
        .cat-empty .material-icons-round{font-size:32px;opacity:0.3;display:block;margin:0 auto 6px}

        /* ===== لایه موبایل ===== */
        .mobile-view{display:none}

        @media(max-width:899px){
            .main-sidebar{display:none}
            .categories-area{display:none}
            .mobile-view{display:block}
            .app-body{display:block}
        }

        .mob-stats{display:flex;gap:8px;padding:16px 16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
        .mob-stats::-webkit-scrollbar{height:0}
        .mob-stat{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:50px;font-size:0.78rem;color:var(--text-sec)}
        .mob-stat b{color:var(--accent);font-size:0.9rem}

        .mob-home{padding:16px}
        .mob-main-card{background:linear-gradient(135deg,var(--bg-card) 0%,rgba(0,212,170,0.07) 100%);border:1px solid rgba(0,212,170,0.2);border-radius:var(--radius);padding:18px;margin-bottom:16px;cursor:pointer;transition:var(--tr);position:relative;overflow:hidden}
        .mob-main-card::before{content:'';position:absolute;top:0;right:0;width:100px;height:100px;background:radial-gradient(circle,var(--accent-dim) 0%,transparent 70%);pointer-events:none}
        .mob-main-card:hover{border-color:rgba(0,212,170,0.4);transform:translateY(-2px)}
        .mob-main-card:active{transform:translateY(0) scale(0.99)}
        .mob-main-head{display:flex;align-items:center;justify-content:space-between}
        .mob-main-title{display:flex;align-items:center;gap:8px;font-size:0.95rem;font-weight:700}
        .mob-main-title .material-icons-round{font-size:24px;color:var(--accent)}
        .mob-main-cnt{font-size:1.6rem;font-weight:900;color:var(--accent)}
        .mob-main-sub{font-size:0.78rem;color:var(--text-muted);margin-top:4px;margin-right:32px}

        .mob-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
        .mob-cat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:var(--tr)}
        .mob-cat-card:hover{border-color:var(--border-light);transform:translateY(-2px)}
        .mob-cat-card:active{transform:scale(0.98)}
        .mob-cat-name{display:flex;align-items:center;gap:6px;font-size:0.8rem;font-weight:600;margin-bottom:8px}
        .mob-cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
        .mob-cat-cnt{font-size:1.3rem;font-weight:900;line-height:1}
        .mob-cat-lbl{font-size:0.7rem;color:var(--text-muted);margin-top:2px}

        /* نمای لیست موبایل */
        .mob-list-view{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:110;background:var(--bg);flex-direction:column}
        .mob-list-view.active{display:flex;animation:slideUp 0.35s ease}
        @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}

        .mob-list-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg-surface);border-bottom:1px solid var(--border)}
        .mob-back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text);cursor:pointer;transition:var(--tr);flex-shrink:0}
        .mob-back:hover{background:var(--bg-card-hover)}
        .mob-back:active{transform:scale(0.92)}
        .mob-list-title{font-size:0.95rem;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .mob-list-color{width:5px;height:20px;border-radius:3px;flex-shrink:0}

        .mob-search-box{display:flex;align-items:center;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;margin:12px 16px 8px;padding:0 10px;transition:var(--tr)}
        .mob-search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
        .mob-search-box .material-icons-round{font-size:19px;color:var(--text-muted)}
        .mob-search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'Vazirmatn',sans-serif;font-size:0.85rem;padding:9px 8px}
        .mob-search-box input::placeholder{color:var(--text-muted)}

        .mob-select-all{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 8px}
        .mob-select-all span{font-size:0.78rem;color:var(--text-sec)}

        .mob-list-body{flex:1;overflow-y:auto;padding:0 16px 100px}

        .mob-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;transition:var(--tr);animation:mi 0.25s ease both}
        .mob-item:hover{background:var(--bg-card-hover)}
        .mob-item.selected{border-color:rgba(0,212,170,0.3);background:rgba(0,212,170,0.05)}
        @keyframes mi{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}

        .mob-item .n-idx{font-size:0.7rem;color:var(--text-muted);font-weight:600;min-width:20px}
        .mob-item .n-name{flex:1;font-size:0.88rem;font-weight:500}

        /* چک‌باکس سفارشی */
        .cbox{position:relative;width:22px;height:22px;flex-shrink:0;cursor:pointer}
        .cbox input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;z-index:2;margin:0}
        .cbox .cm{position:absolute;top:0;left:0;width:22px;height:22px;border:2px solid var(--border-light);border-radius:6px;background:var(--bg-input);transition:var(--tr)}
        .cbox input:checked+.cm{background:var(--accent);border-color:var(--accent)}
        .cbox .cm::after{content:'';position:absolute;display:none;top:3px;left:7px;width:5px;height:10px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
        .cbox input:checked+.cm::after{display:block}

        /* نوار انتقال موبایل */
        .transfer-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,25,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:120;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1)}
        .transfer-bar.vis{transform:translateY(0)}
        .tb-info{display:flex;align-items:center;gap:8px}
        .tb-cnt{background:var(--accent-dim);color:var(--accent);font-weight:700;font-size:0.82rem;padding:3px 11px;border-radius:50px}
        .tb-lbl{font-size:0.8rem;color:var(--text-sec)}
        .btn-tf{display:flex;align-items:center;gap:6px;padding:10px 20px;background:var(--accent);color:var(--bg);border:none;border-radius:8px;font-family:'Vazirmatn',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;transition:var(--tr)}
        .btn-tf:hover{filter:brightness(1.1);box-shadow:0 4px 18px var(--accent-glow)}
        .btn-tf:active{transform:scale(0.96)}
        .btn-tf .material-icons-round{font-size:19px}

        /* مودال */
        .modal-ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s ease}
        .modal-ov.open{opacity:1;pointer-events:auto}
        .modal-sheet{background:var(--bg-surface);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;padding:8px 0 24px;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1)}
        .modal-ov.open .modal-sheet{transform:translateY(0)}
        .modal-handle{width:40px;height:4px;background:var(--border-light);border-radius:2px;margin:8px auto 14px}
        .modal-title{font-size:0.95rem;font-weight:700;padding:0 20px;margin-bottom:10px}
        .modal-opt{display:flex;align-items:center;gap:12px;padding:13px 20px;border:none;background:transparent;width:100%;text-align:right;color:var(--text);font-family:'Vazirmatn',sans-serif;font-size:0.88rem;font-weight:500;cursor:pointer;transition:var(--tr)}
        .modal-opt:hover{background:var(--bg-card)}
        .modal-opt-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
        .modal-opt-cnt{margin-right:auto;font-size:0.76rem;color:var(--text-muted);font-weight:400}
        .modal-cancel{display:block;width:calc(100% - 40px);margin:14px auto 0;padding:11px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text-sec);font-family:'Vazirmatn',sans-serif;font-size:0.85rem;font-weight:600;cursor:pointer;transition:var(--tr)}
        .modal-cancel:hover{background:var(--bg-card)}

        /* مودال تایید */
        .confirm-sheet{background:var(--bg-surface);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-width:420px;padding:8px 24px 28px;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1)}
        .modal-ov.open .confirm-sheet{transform:translateY(0)}
        .confirm-msg{font-size:0.9rem;color:var(--text-sec);line-height:1.8;padding:14px 0 20px}
        .confirm-acts{display:flex;gap:10px}
        .confirm-acts button{flex:1;padding:11px;border:none;border-radius:8px;font-family:'Vazirmatn',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;transition:var(--tr)}
        .confirm-acts button:active{transform:scale(0.97)}
        .btn-c-yes{background:var(--danger);color:#fff}
        .btn-c-yes:hover{filter:brightness(1.1)}
        .btn-c-no{background:var(--bg-card);color:var(--text);border:1px solid var(--border)!important}
        .btn-c-no:hover{background:var(--bg-card-hover)}

        /* مودال افزودن دستی (موبایل) */
        .add-sheet{background:var(--bg-surface);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-width:420px;padding:8px 24px 28px;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1)}
        .modal-ov.open .add-sheet{transform:translateY(0)}
        .add-sheet input{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-family:'Vazirmatn',sans-serif;font-size:0.9rem;outline:none;transition:var(--tr);margin-bottom:12px}
        .add-sheet input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
        .add-sheet input::placeholder{color:var(--text-muted)}
        .add-sheet .btn-primary{width:100%;justify-content:center}

        .btn-primary{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;background:var(--accent);color:var(--bg);border:none;border-radius:8px;font-family:'Vazirmatn',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;transition:var(--tr)}
        .btn-primary:hover{filter:brightness(1.1);box-shadow:0 4px 18px var(--accent-glow)}
        .btn-primary:active{transform:scale(0.96)}

        /* تست */
        .toast-wrap{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
        .toast{padding:11px 20px;border-radius:8px;font-size:0.82rem;font-weight:600;font-family:'Vazirmatn',sans-serif;box-shadow:0 8px 30px rgba(0,0,0,0.45);animation:tIn 0.4s ease,tOut 0.4s ease 2.6s forwards;pointer-events:auto;max-width:90vw;text-align:center}
        .toast-success{background:rgba(0,212,170,0.14);color:var(--accent);border:1px solid rgba(0,212,170,0.3)}
        .toast-error{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(239,68,68,0.3)}
        .toast-info{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,158,11,0.3)}
        @keyframes tIn{from{opacity:0;transform:translateY(-14px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes tOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-14px) scale(0.95)}}

        /* پوشش رها کردن فایل */
        .drop-ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,212,170,0.07);backdrop-filter:blur(8px);z-index:300;display:none;align-items:center;justify-content:center}
        .drop-ov.active{display:flex}
        .drop-box{border:3px dashed var(--accent);border-radius:24px;padding:50px 36px;text-align:center}
        .drop-box .material-icons-round{font-size:52px;color:var(--accent)}
        .drop-box p{font-size:0.95rem;color:var(--accent);margin-top:10px;font-weight:600}

        /* دکمه افزودن موبایل */
        .mob-fab{position:fixed;bottom:24px;left:24px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--bg);border:none;display:none;align-items:center;justify-content:center;box-shadow:0 6px 24px var(--accent-glow);cursor:pointer;z-index:50;transition:var(--tr)}
        .mob-fab:hover{filter:brightness(1.1)}
        .mob-fab:active{transform:scale(0.92)}
        .mob-fab .material-icons-round{font-size:26px}
        @media(max-width:899px){.mob-fab{display:flex}}

        /* خالی */
        .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 20px;min-height:40vh}
        .empty-state .material-icons-round{font-size:56px;color:var(--text-muted);margin-bottom:14px;opacity:0.4}
        .empty-state h3{font-size:1rem;font-weight:700;color:var(--text-sec);margin-bottom:6px}
        .empty-state p{font-size:0.82rem;color:var(--text-muted);margin-bottom:20px;max-width:260px}

        .list-empty{text-align:center;padding:30px 16px;color:var(--text-muted);font-size:0.82rem}
        .list-empty .material-icons-round{font-size:40px;opacity:0.25;display:block;margin:0 auto 8px}

        .hidden{display:none!important}

        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
        @media(min-width:600px)and (max-width:899px){.mob-grid{grid-template-columns:repeat(3,1fr)}}
        @media(min-width:900px){.mob-fab{display:none!important}}
    </style>
</head>
<body>

    <!-- هدر -->
    <header class="app-header">
        <div class="header-row">
            <h1 class="app-title">مدیریت انتقال پرسنل</h1>
            <div class="header-actions">
                <button class="icon-btn" id="btnUpload" title="آپلود اکسل" aria-label="آپلود فایل اکسل">
                    <span class="material-icons-round">upload_file</span>
                </button>
                <div style="position:relative">
                    <button class="icon-btn" id="btnMore" title="بیشتر" aria-label="منوی بیشتر">
                        <span class="material-icons-round">more_vert</span>
                    </button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <button class="dropdown-item" id="btnExportZip">
                            <span class="material-icons-round">folder_zip</span>
                            خروجی ZIP (اکسل)
                        </button>
                        <button class="dropdown-item" id="btnExportJson">
                            <span class="material-icons-round">data_object</span>
                            خروجی JSON
                        </button>
                        <button class="dropdown-item" id="btnImportJson">
                            <span class="material-icons-round">upload</span>
                            ورود JSON
                        </button>
                        <button class="dropdown-item danger" id="btnClearAll">
                            <span class="material-icons-round">delete_sweep</span>
                            پاک کردن همه داده‌ها
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- بدنه اصلی -->
    <div class="app-body">

        <!-- ===== سایدبار دسکتاپ: لیست اصلی ===== -->
        <aside class="main-sidebar" id="mainSidebar">
            <div class="sidebar-head">
                <div class="sidebar-title-row">
                    <span class="material-icons-round">description</span>
                    <h2>فایل اصلی</h2>
                    <span class="sidebar-count" id="mainCount">0</span>
                </div>
                <div class="sidebar-search">
                    <span class="material-icons-round">search</span>
                    <input type="text" id="desktopSearch" placeholder="جستجو در اسامی..." aria-label="جستجو">
                    <button class="search-clr" id="desktopSearchClr" aria-label="پاک کردن">
                        <span class="material-icons-round">close</span>
                    </button>
                </div>
            </div>
            <div class="sidebar-list" id="mainListContainer"></div>
            <div class="sidebar-add">
                <input type="text" id="manualAddInput" placeholder="افزودن دستی نام جدید..." aria-label="افزودن دستی">
                <button class="add-btn" id="manualAddBtn" title="افزودن" aria-label="افزودن">
                    <span class="material-icons-round">add</span>
                </button>
            </div>
        </aside>

        <!-- ===== ناحیه دسته‌بندی‌ها (دسکتاپ) ===== -->
        <div class="categories-area" id="categoriesArea">
            <div class="cats-grid" id="catsGrid"></div>
        </div>

        <!-- ===== نمای موبایل ===== -->
        <div class="mobile-view" id="mobileView">
            <div class="mob-stats" id="mobStats"></div>
            <div class="mob-home" id="mobHome"></div>
        </div>
    </div>

    <!-- نمای لیست موبایل -->
    <div class="mob-list-view" id="mobListView">
        <div class="mob-list-head">
            <button class="mob-back" id="mobBack" aria-label="بازگشت">
                <span class="material-icons-round">arrow_forward</span>
            </button>
            <span class="mob-list-color" id="mobListColor"></span>
            <h2 class="mob-list-title" id="mobListTitle"></h2>
        </div>
        <div class="mob-search-box">
            <span class="material-icons-round">search</span>
            <input type="text" id="mobSearch" placeholder="جستجو..." aria-label="جستجو">
        </div>
        <div class="mob-select-all">
            <span id="mobSelectAllLabel"></span>
            <label class="cbox">
                <input type="checkbox" id="mobSelectAllCb">
                <span class="cm"></span>
            </label>
        </div>
        <div class="mob-list-body" id="mobListBody"></div>
    </div>

    <!-- نوار انتقال موبایل -->
    <div class="transfer-bar" id="transferBar">
        <div class="tb-info">
            <span class="tb-cnt" id="tfCount">0</span>
            <span class="tb-lbl">مورد انتخاب شده</span>
        </div>
        <button class="btn-tf" id="btnTransfer">
            <span class="material-icons-round">swap_horiz</span>
            انتقال
        </button>
    </div>

    <!-- دکمه افزودن موبایل -->
    <button class="mob-fab" id="mobFabAdd" aria-label="افزودن دستی">
        <span class="material-icons-round">person_add</span>
    </button>

    <!-- مودال انتقال -->
    <div class="modal-ov" id="transferModal">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <h3 class="modal-title">انتقال به:</h3>
            <div id="transferOptions"></div>
            <button class="modal-cancel" id="btnCancelTransfer">انصراف</button>
        </div>
    </div>

    <!-- مودال تایید -->
    <div class="modal-ov" id="confirmModal">
        <div class="confirm-sheet">
            <div class="modal-handle"></div>
            <p class="confirm-msg" id="confirmMsg"></p>
            <div class="confirm-acts">
                <button class="btn-c-no" id="btnConfirmNo">خیر</button>
                <button class="btn-c-yes" id="btnConfirmYes">بله</button>
            </div>
        </div>
    </div>

    <!-- مودال افزودن دستی (موبایل) -->
    <div class="modal-ov" id="addModal">
        <div class="add-sheet">
            <div class="modal-handle"></div>
            <h3 class="modal-title" style="margin-bottom:14px">افزودن دستی نام جدید</h3>
            <input type="text" id="mobAddInput" placeholder="نام و نام خانوادگی...">
            <button class="btn-primary" id="mobAddBtn">
                <span class="material-icons-round">add</span>
                افزودن به فایل اصلی
            </button>
        </div>
    </div>

    <!-- تست -->
    <div class="toast-wrap" id="toastWrap"></div>

    <!-- پوشش رها کردن -->
    <div class="drop-ov" id="dropOv">
        <div class="drop-box">
            <span class="material-icons-round">cloud_upload</span>
            <p>فایل را اینجا رها کنید</p>
        </div>
    </div>

    <!-- ورودی‌های مخفی -->
    <input type="file" id="fileExcel" accept=".xlsx,.xls,.csv" class="hidden">
    <input type="file" id="fileJson" accept=".json" class="hidden">

    <script>
    /* ==========================================================
       ثابت‌ها
    ========================================================== */
    const CATEGORIES = [
        { name: 'تولید برم 1',      color: '#ff6b6b' },
        { name: 'تولید برم 2',      color: '#fbbf24' },
        { name: 'تولید برم 3',      color: '#34d399' },
        { name: 'تولید برم 4',      color: '#60a5fa' },
        { name: 'سالن نشا',          color: '#a78bfa' },
        { name: 'انتقالی به امیر',   color: '#f472b6' },
        { name: 'انتقالی به گوزل',   color: '#fb923c' },
        { name: 'ضد عفونی و سبد',   color: '#2dd4bf' },
        { name: 'نخ سوزی و نخ ریسی', color: '#818cf8' },
        { name: 'استعلاجی',          color: '#e879f9' },
        { name: 'تسویه',             color: '#22d3ee' }
    ];

    const MAIN_KEY = '__main__';
    const STORAGE_KEY = 'personnel_transfer_v3';

    /* ==========================================================
       وضعیت
    ========================================================== */
    let appState = { mainList: [], categories: {} };
    let mobCurrentView = 'home';
    let mobSelectedItems = new Set();
    let mobSearchQuery = '';
    let desktopSearchQuery = '';
    let confirmCb = null;

    /* ==========================================================
       مدیریت وضعیت
    ========================================================== */
    function createEmptyState() {
        const s = { mainList: [], categories: {} };
        CATEGORIES.forEach(c => { s.categories[c.name] = []; });
        return s;
    }

    function loadState() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const p = JSON.parse(saved);
                appState.mainList = Array.isArray(p.mainList) ? p.mainList : [];
                appState.categories = p.categories || {};
                CATEGORIES.forEach(c => {
                    if (!Array.isArray(appState.categories[c.name])) appState.categories[c.name] = [];
                });
            } else {
                appState = createEmptyState();
            }
        } catch (e) {
            console.error('خطا در بارگذاری:', e);
            appState = createEmptyState();
        }
    }

    function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); }
        catch (e) { showToast('خطا در ذخیره‌سازی! حافظه پر شده.', 'error'); }
    }

    function getTotalCount() {
        let t = appState.mainList.length;
        CATEGORIES.forEach(c => { t += (appState.categories[c.name] || []).length; });
        return t;
    }

    function getCatColor(name) {
        const c = CATEGORIES.find(x => x.name === name);
        return c ? c.color : '#6b7280';
    }

    function nameExistsAnywhere(name) {
        if (appState.mainList.includes(name)) return true;
        for (const c of CATEGORIES) {
            if ((appState.categories[c.name] || []).includes(name)) return true;
        }
        return false;
    }

    /* ==========================================================
       رندر دسکتاپ
    ========================================================== */
    function renderDesktop() {
        renderDesktopMainList();
        renderDesktopCategories();
    }

    function renderDesktopMainList() {
        const container = document.getElementById('mainListContainer');
        const countEl = document.getElementById('mainCount');
        const q = desktopSearchQuery.trim().toLowerCase();
        const items = q
            ? appState.mainList.filter(n => n.toLowerCase().includes(q))
            : appState.mainList;

        countEl.textContent = appState.mainList.length;

        if (items.length === 0) {
            const msg = appState.mainList.length === 0
                ? 'فایل اکسل آپلود کنید یا نام دستی اضافه کنید'
                : 'نتیجه‌ای یافت نشد';
            container.innerHTML = `<div class="list-empty"><span class="material-icons-round">person_off</span>${msg}</div>`;
            return;
        }

        container.innerHTML = items.map((name, i) => `
            <div class="name-item" draggable="true" data-name="${esc(name)}" data-source="${MAIN_KEY}">
                <span class="material-icons-round grip">drag_indicator</span>
                <span class="n-idx">${i + 1}</span>
                <span class="n-name">${esc(name)}</span>
            </div>
        `).join('');

        // اتصال رویدادهای درگ
        container.querySelectorAll('.name-item').forEach(el => {
            el.addEventListener('dragstart', onDragStart);
            el.addEventListener('dragend', onDragEnd);
        });
    }

    function renderDesktopCategories() {
        const grid = document.getElementById('catsGrid');

        if (appState.mainList.length === 0 && getTotalCount() === 0) {
            grid.innerHTML = `
                <div class="empty-state" style="grid-column:1/-1">
                    <span class="material-icons-round">upload_file</span>
                    <h3>هنوز فایلی بارگذاری نشده</h3>
                    <p>فایل اکسل خود را آپلود کنید یا نام دستی اضافه کنید</p>
                </div>
            `;
            return;
        }

        grid.innerHTML = CATEGORIES.map(cat => {
            const names = appState.categories[cat.name] || [];
            const members = names.length > 0
                ? names.map(n => `
                    <div class="cat-member" draggable="true" data-name="${esc(n)}" data-source="${esc(cat.name)}">
                        <span class="material-icons-round grip">drag_indicator</span>
                        <span class="m-name">${esc(n)}</span>
                    </div>
                `).join('')
                : `<div class="cat-empty"><span class="material-icons-round">drag_handle</span>اسامی را اینجا رها کنید</div>`;

            return `
                <div class="cat-panel" data-dest="${esc(cat.name)}">
                    <div class="cat-panel-head">
                        <span class="cat-dot" style="background:${cat.color}"></span>
                        <span class="cat-panel-name">${cat.name}</span>
                        <span class="cat-panel-cnt" style="background:${cat.color}18;color:${cat.color}">${names.length} نفر</span>
                    </div>
                    <div class="cat-panel-body">${members}</div>
                </div>
            `;
        }).join('');

        // اتصال رویدادهای درگ به اعضای دسته‌بندی
        grid.querySelectorAll('.cat-member').forEach(el => {
            el.addEventListener('dragstart', onDragStart);
            el.addEventListener('dragend', onDragEnd);
        });

        // اتصال رویدادهای رها کردن به پنل‌ها
        grid.querySelectorAll('.cat-panel').forEach(panel => {
            panel.addEventListener('dragover', onDragOver);
            panel.addEventListener('dragenter', onDragEnter);
            panel.addEventListener('dragleave', onDragLeave);
            panel.addEventListener('drop', onDrop);
        });

        // سایدبار هم ناحیه رها کردن است (برای بازگشت)
        const sidebar = document.getElementById('mainSidebar');
        sidebar.addEventListener('dragover', onDragOver);
        sidebar.addEventListener('dragenter', (e) => {
            e.preventDefault();
            sidebar.style.boxShadow = 'inset 0 0 0 2px var(--accent)';
        });
        sidebar.addEventListener('dragleave', (e) => {
            if (!sidebar.contains(e.relatedTarget)) {
                sidebar.style.boxShadow = '';
            }
        });
        sidebar.addEventListener('drop', (e) => {
            e.preventDefault();
            sidebar.style.boxShadow = '';
            const data = readDragData(e);
            if (data && data.source !== MAIN_KEY) {
                executeTransfer(data.source, MAIN_KEY, [data.name]);
            }
        });
    }

    /* ==========================================================
       درگ اند دراپ
    ========================================================== */
    let dragData = null;

    function onDragStart(e) {
        const name = e.currentTarget.dataset.name;
        const source = e.currentTarget.dataset.source;
        dragData = { name, source };
        e.dataTransfer.setData('text/plain', JSON.stringify({ name, source }));
        e.dataTransfer.effectAllowed = 'move';
        e.currentTarget.classList.add('dragging');

        // ایجاد تصویر درگ سفارشی
        const ghost = e.currentTarget.cloneNode(true);
        ghost.style.position = 'absolute';
        ghost.style.top = '-1000px';
        ghost.style.opacity = '0.85';
        ghost.style.background = 'var(--accent)';
        ghost.style.color = 'var(--bg)';
        ghost.style.borderRadius = '8px';
        ghost.style.padding = '8px 16px';
        ghost.style.fontFamily = 'Vazirmatn';
        ghost.style.fontSize = '0.85rem';
        ghost.style.fontWeight = '600';
        ghost.textContent = name;
        document.body.appendChild(ghost);
        e.dataTransfer.setDragImage(ghost, 0, 0);
        requestAnimationFrame(() => document.body.removeChild(ghost));
    }

    function onDragEnd(e) {
        e.currentTarget.classList.remove('dragging');
        dragData = null;
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        document.getElementById('mainSidebar').style.boxShadow = '';
    }

    function onDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
    }

    function onDragEnter(e) {
        e.preventDefault();
        const panel = e.currentTarget;
        if (panel.classList.contains('cat-panel')) {
            panel.classList.add('drag-over');
        }
    }

    function onDragLeave(e) {
        const panel = e.currentTarget;
        if (!panel.contains(e.relatedTarget)) {
            panel.classList.remove('drag-over');
        }
    }

    function readDragData(e) {
        try {
            return JSON.parse(e.dataTransfer.getData('text/plain'));
        } catch { return dragData; }
    }

    function onDrop(e) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        const data = readDragData(e);
        if (!data) return;

        const dest = e.currentTarget.dataset.dest;
        if (!dest || data.source === dest) return;
        if (data.source === MAIN_KEY && dest === MAIN_KEY) return;

        executeTransfer(data.source, dest, [data.name]);
    }

    /* ==========================================================
       منطق انتقال
    ========================================================== */
    function executeTransfer(sourceKey, destKey, items) {
        if (!items || items.length === 0) return;

        // حذف از مبدا
        if (sourceKey === MAIN_KEY) {
            appState.mainList = appState.mainList.filter(n => !items.includes(n));
        } else {
            appState.categories[sourceKey] = (appState.categories[sourceKey] || []).filter(n => !items.includes(n));
        }

        // اضافه به مقصد (بدون تکرار)
        const destList = destKey === MAIN_KEY ? appState.mainList : (appState.categories[destKey] || []);
        const existing = new Set(destList);
        items.forEach(n => { if (!existing.has(n)) destList.push(n); });
        if (destKey !== MAIN_KEY) appState.categories[destKey] = destList;

        saveState();
        renderAll();

        const destName = destKey === MAIN_KEY ? 'فایل اصلی' : destKey;
        showToast(`${items.length} مورد به "${destName}" منتقل شد`, 'success');
    }

    /* ==========================================================
       افزودن دستی
    ========================================================== */
    function addManualName(name) {
        name = name.trim();
        if (!name) { showToast('لطفاً نام را وارد کنید', 'error'); return; }
        if (nameExistsAnywhere(name)) { showToast('این نام از قبل وجود دارد', 'error'); return; }
        appState.mainList.push(name);
        saveState();
        renderAll();
        showToast(`"${name}" به فایل اصلی اضافه شد`, 'success');
    }

    /* ==========================================================
       رندر موبایل
    ========================================================== */
    function renderMobile() {
        renderMobileHome();
    }

    function renderMobileHome() {
        const total = getTotalCount();
        const statsEl = document.getElementById('mobStats');
        const homeEl = document.getElementById('mobHome');

        statsEl.innerHTML = `
            <div class="mob-stat">مجموع: <b>${total}</b></div>
            <div class="mob-stat">فایل اصلی: <b>${appState.mainList.length}</b></div>
            <div class="mob-stat">منتقل شده: <b>${total - appState.mainList.length}</b></div>
        `;

        if (total === 0) {
            homeEl.innerHTML = `
                <div class="empty-state">
                    <span class="material-icons-round">upload_file</span>
                    <h3>هنوز فایلی بارگذاری نشده</h3>
                    <p>فایل اکسل خود را آپلود کنید یا نام دستی اضافه کنید</p>
                    <button class="btn-primary" id="mobUploadEmpty">
                        <span class="material-icons-round">upload_file</span>
                        آپلود فایل اکسل
                    </button>
                </div>
            `;
            document.getElementById('mobUploadEmpty').addEventListener('click', () => {
                document.getElementById('fileExcel').click();
            });
            return;
        }

        let html = `
            <div class="mob-main-card" data-view="${MAIN_KEY}">
                <div class="mob-main-head">
                    <div class="mob-main-title">
                        <span class="material-icons-round">description</span>
                        فایل اصلی
                    </div>
                    <div class="mob-main-cnt">${appState.mainList.length}</div>
                </div>
                <div class="mob-main-sub">نفر در لیست اصلی</div>
            </div>
            <div class="mob-grid">
        `;

        CATEGORIES.forEach(cat => {
            const cnt = (appState.categories[cat.name] || []).length;
            html += `
                <div class="mob-cat-card" data-view="${esc(cat.name)}">
                    <div class="mob-cat-name">
                        <span class="mob-cat-dot" style="background:${cat.color}"></span>
                        ${cat.name}
                    </div>
                    <div class="mob-cat-cnt" style="color:${cat.color}">${cnt}</div>
                    <div class="mob-cat-lbl">نفر</div>
                </div>
            `;
        });

        html += '</div>';
        homeEl.innerHTML = html;

        // اتصال رویدادها
        homeEl.querySelectorAll('.mob-main-card, .mob-cat-card').forEach(card => {
            card.addEventListener('click', () => openMobListView(card.dataset.view));
        });
    }

    function openMobListView(viewKey) {
        mobCurrentView = viewKey;
        mobSelectedItems.clear();
        mobSearchQuery = '';
        document.getElementById('mobSearch').value = '';

        const title = viewKey === MAIN_KEY ? 'فایل اصلی' : viewKey;
        const color = getCatColor(viewKey);
        document.getElementById('mobListTitle').textContent = title;
        document.getElementById('mobListColor').style.background = color;

        document.getElementById('mobListView').classList.add('active');
        document.getElementById('transferBar').classList.remove('vis');

        renderMobListItems();
    }

    function closeMobListView() {
        document.getElementById('mobListView').classList.remove('active');
        document.getElementById('transferBar').classList.remove('vis');
        mobSelectedItems.clear();
        mobCurrentView = 'home';
        renderMobileHome();
    }

    function getMobCurrentList() {
        if (mobCurrentView === MAIN_KEY) return appState.mainList;
        return appState.categories[mobCurrentView] || [];
    }

    function renderMobListItems() {
        const body = document.getElementById('mobListBody');
        const items = getMobCurrentList();
        const q = mobSearchQuery.trim().toLowerCase();
        const filtered = q ? items.filter(n => n.toLowerCase().includes(q)) : items;

        if (filtered.length === 0) {
            const msg = items.length === 0 ? 'هنوز شخصی در این لیست نیست' : 'نتیجه‌ای یافت نشد';
            body.innerHTML = `<div class="list-empty"><span class="material-icons-round">person_off</span>${msg}</div>`;
            return;
        }

        body.innerHTML = filtered.map((name, i) => {
            const sel = mobSelectedItems.has(name);
            return `
                <div class="mob-item ${sel ? 'selected' : ''}" data-name="${esc(name)}">
                    <span class="n-idx">${i + 1}</span>
                    <label class="cbox" onclick="event.stopPropagation()">
                        <input type="checkbox" ${sel ? 'checked' : ''} data-name="${esc(name)}">
                        <span class="cm"></span>
                    </label>
                    <span class="n-name">${esc(name)}</span>
                </div>
            `;
        }).join('');

        // رویداد چک‌باکس
        body.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', (e) => {
                const n = e.target.dataset.name;
                if (e.target.checked) mobSelectedItems.add(n); else mobSelectedItems.delete(n);
                e.target.closest('.mob-item').classList.toggle('selected', e.target.checked);
                updateMobTransferBar();
                updateMobSelectAll();
            });
        });

        body.querySelectorAll('.mob-item').forEach(item => {
            item.addEventListener('click', () => {
                const cb = item.querySelector('input[type="checkbox"]');
                if (cb) { cb.checked = !cb.checked; cb.dispatchEvent(new Event('change')); }
            });
        });

        updateMobSelectAll();
    }

    function updateMobTransferBar() {
        const bar = document.getElementById('transferBar');
        const cnt = mobSelectedItems.size;
        if (cnt > 0) {
            bar.classList.add('vis');
            document.getElementById('tfCount').textContent = cnt;
        } else {
            bar.classList.remove('vis');
        }
    }

    function updateMobSelectAll() {
        const items = getMobCurrentList();
        const q = mobSearchQuery.trim().toLowerCase();
        const filtered = q ? items.filter(n => n.toLowerCase().includes(q)) : items;
        const allSel = filtered.length > 0 && filtered.every(n => mobSelectedItems.has(n));
        document.getElementById('mobSelectAllCb').checked = allSel;
        document.getElementById('mobSelectAllLabel').textContent = `انتخاب همه (${filtered.length} مورد)`;
    }

    /* ==========================================================
       مودال انتقال موبایل
    ========================================================== */
    function openMobTransferModal() {
        if (mobSelectedItems.size === 0) return;
        const modal = document.getElementById('transferModal');
        const opts = document.getElementById('transferOptions');
        let html = '';

        if (mobCurrentView !== MAIN_KEY) {
            html += `<button class="modal-opt" data-dest="${MAIN_KEY}">
                <span class="modal-opt-dot" style="background:#00d4aa"></span>
                فایل اصلی
                <span class="modal-opt-cnt">${appState.mainList.length} نفر</span>
            </button>`;
        }

        CATEGORIES.forEach(cat => {
            if (cat.name === mobCurrentView) return;
            const cnt = (appState.categories[cat.name] || []).length;
            html += `<button class="modal-opt" data-dest="${esc(cat.name)}">
                <span class="modal-opt-dot" style="background:${cat.color}"></span>
                ${cat.name}
                <span class="modal-opt-cnt">${cnt} نفر</span>
            </button>`;
        });

        opts.innerHTML = html;
        modal.classList.add('open');

        opts.querySelectorAll('.modal-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                executeTransfer(mobCurrentView, btn.dataset.dest, Array.from(mobSelectedItems));
                mobSelectedItems.clear();
                closeMobTransferModal();
                closeMobListView();
            });
        });
    }

    function closeMobTransferModal() {
        document.getElementById('transferModal').classList.remove('open');
    }

    /* ==========================================================
       پردازش اکسل
    ========================================================== */
    async function processExcelFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                    const allValues = [];
                    const seen = new Set();
                    for (const row of json) {
                        if (!Array.isArray(row)) continue;
                        for (const cell of row) {
                            const val = String(cell).trim();
                            if (val && val !== 'undefined' && val !== 'null') {
                                if (!seen.has(val)) { seen.add(val); allValues.push(val); }
                            }
                        }
                    }
                    resolve(allValues);
                } catch (err) { reject(err); }
            };
            reader.onerror = () => reject(new Error('خطا در خواندن فایل'));
            reader.readAsArrayBuffer(file);
        });
    }

    async function handleExcelUpload(file) {
        try {
            const values = await processExcelFile(file);
            if (values.length === 0) { showToast('فایل خالی است', 'error'); return; }

            if (getTotalCount() > 0) {
                showConfirm(
                    `با بارگذاری فایل جدید، ${getTotalCount()} نفر موجود حذف و ${values.length} نفر جایگزین می‌شوند. ادامه می‌دهید؟`,
                    () => {
                        appState = createEmptyState();
                        appState.mainList = values;
                        saveState(); renderAll();
                        showToast(`${values.length} نام بارگذاری شد`, 'success');
                    }
                );
            } else {
                appState.mainList = values;
                saveState(); renderAll();
                showToast(`${values.length} نام بارگذاری شد`, 'success');
            }
        } catch (err) {
            console.error(err);
            showToast('خطا در پردازش فایل اکسل', 'error');
        }
    }

    /* ==========================================================
       خروجی ZIP
    ========================================================== */
    async function exportZip() {
        if (getTotalCount() === 0) { showToast('داده‌ای برای خروجی نیست', 'info'); return; }
        try {
            const zip = new JSZip();
            const mainData = [['نام و نام خانوادگی'], ...appState.mainList.map(n => [n])];
            const mainWs = XLSX.utils.aoa_to_sheet(mainData);
            const mainWb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(mainWb, mainWs, 'فایل اصلی');
            zip.file('فایل اصلی.xlsx', XLSX.write(mainWb, { type: 'array', bookType: 'xlsx' }));

            CATEGORIES.forEach(cat => {
                const names = appState.categories[cat.name] || [];
                const wsData = [['نام و نام خانوادگی'], ...names.map(n => [n])];
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, cat.name);
                zip.file(`${cat.name}.xlsx`, XLSX.write(wb, { type: 'array', bookType: 'xlsx' }));
            });

            const content = await zip.generateAsync({ type: 'blob' });
            saveAs(content, `انتقال_پرسنل_${new Date().toISOString().slice(0,10)}.zip`);
            showToast('فایل ZIP ایجاد شد', 'success');
        } catch (err) { console.error(err); showToast('خطا در ایجاد ZIP', 'error'); }
    }

    /* ==========================================================
       خروجی/ورود JSON
    ========================================================== */
    function exportJson() {
        if (getTotalCount() === 0) { showToast('داده‌ای برای خروجی نیست', 'info'); return; }
        try {
            const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
            saveAs(blob, `انتقال_پرسنل_${new Date().toISOString().slice(0,10)}.json`);
            showToast('فایل JSON ایجاد شد', 'success');
        } catch (err) { showToast('خطا در ایجاد JSON', 'error'); }
    }

    function handleJsonImport(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (!data || !Array.isArray(data.mainList) || !data.categories) {
                    showToast('فرمت JSON نامعتبر', 'error'); return;
                }
                appState.mainList = data.mainList;
                appState.categories = data.categories;
                CATEGORIES.forEach(c => {
                    if (!Array.isArray(appState.categories[c.name])) appState.categories[c.name] = [];
                });
                saveState(); renderAll();
                showToast('داده‌ها از JSON بارگذاری شد', 'success');
            } catch (err) { showToast('خطا در خواندن JSON', 'error'); }
        };
        reader.readAsText(file);
    }

    /* ==========================================================
       مودال تایید
    ========================================================== */
    function showConfirm(msg, cb) {
        confirmCb = cb;
        document.getElementById('confirmMsg').textContent = msg;
        document.getElementById('confirmModal').classList.add('open');
    }
    function closeConfirm() {
        document.getElementById('confirmModal').classList.remove('open');
        confirmCb = null;
    }

    /* ==========================================================
       تست
    ========================================================== */
    function showToast(msg, type = 'success') {
        const wrap = document.getElementById('toastWrap');
        const t = document.createElement('div');
        t.className = `toast toast-${type}`;
        t.textContent = msg;
        wrap.appendChild(t);
        setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 3200);
    }

    /* ==========================================================
       رندر کلی
    ========================================================== */
    function renderAll() {
        renderDesktop();
        renderMobile();
    }

    /* ==========================================================
       ابزار
    ========================================================== */
    function esc(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    /* ==========================================================
       راه‌اندازی
    ========================================================== */
    function init() {
        loadState();
        renderAll();
        setupEvents();
    }

    function setupEvents() {
        // آپلود اکسل
        document.getElementById('btnUpload').addEventListener('click', () => {
            document.getElementById('fileExcel').click();
        });
        document.getElementById('fileExcel').addEventListener('change', (e) => {
            const f = e.target.files[0];
            if (f) handleExcelUpload(f);
            e.target.value = '';
        });

        // منوی بیشتر
        const moreBtn = document.getElementById('btnMore');
        const dd = document.getElementById('dropdownMenu');
        moreBtn.addEventListener('click', (e) => { e.stopPropagation(); dd.classList.toggle('open'); });
        document.addEventListener('click', () => dd.classList.remove('open'));
        dd.addEventListener('click', (e) => e.stopPropagation());

        document.getElementById('btnExportZip').addEventListener('click', () => { dd.classList.remove('open'); exportZip(); });
        document.getElementById('btnExportJson').addEventListener('click', () => { dd.classList.remove('open'); exportJson(); });
        document.getElementById('btnImportJson').addEventListener('click', () => { dd.classList.remove('open'); document.getElementById('fileJson').click(); });
        document.getElementById('fileJson').addEventListener('change', (e) => {
            const f = e.target.files[0];
            if (f) handleJsonImport(f);
            e.target.value = '';
        });
        document.getElementById('btnClearAll').addEventListener('click', () => {
            dd.classList.remove('open');
            if (getTotalCount() === 0) { showToast('داده‌ای نیست', 'info'); return; }
            showConfirm('تمام داده‌ها پاک خواهند شد. ادامه می‌دهید؟', () => {
                appState = createEmptyState();
                saveState(); renderAll();
                showToast('داده‌ها پاک شدند', 'success');
            });
        });

        // جستجوی دسکتاپ
        const dSearch = document.getElementById('desktopSearch');
        const dSearchClr = document.getElementById('desktopSearchClr');
        dSearch.addEventListener('input', () => {
            desktopSearchQuery = dSearch.value;
            dSearchClr.classList.toggle('vis', desktopSearchQuery.length > 0);
            renderDesktopMainList();
        });
        dSearchClr.addEventListener('click', () => {
            dSearch.value = '';
            desktopSearchQuery = '';
            dSearchClr.classList.remove('vis');
            renderDesktopMainList();
        });

        // افزودن دستی (دسکتاپ)
        const addInput = document.getElementById('manualAddInput');
        const addBtn = document.getElementById('manualAddBtn');
        addBtn.addEventListener('click', () => {
            addManualName(addInput.value);
            addInput.value = '';
        });
        addInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                addManualName(addInput.value);
                addInput.value = '';
            }
        });

        // بازگشت موبایل
        document.getElementById('mobBack').addEventListener('click', closeMobListView);

        // جستجوی موبایل
        document.getElementById('mobSearch').addEventListener('input', (e) => {
            mobSearchQuery = e.target.value;
            mobSelectedItems.clear();
            renderMobListItems();
            updateMobTransferBar();
        });

        // انتخاب همه موبایل
        document.getElementById('mobSelectAllCb').addEventListener('change', (e) => {
            const items = getMobCurrentList();
            const q = mobSearchQuery.trim().toLowerCase();
            const filtered = q ? items.filter(n => n.toLowerCase().includes(q)) : items;
            if (e.target.checked) {
                filtered.forEach(n => mobSelectedItems.add(n));
            } else {
                filtered.forEach(n => mobSelectedItems.delete(n));
            }
            renderMobListItems();
            updateMobTransferBar();
        });

        // انتقال موبایل
        document.getElementById('btnTransfer').addEventListener('click', openMobTransferModal);
        document.getElementById('btnCancelTransfer').addEventListener('click', closeMobTransferModal);
        document.getElementById('transferModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeMobTransferModal();
        });

        // مودال تایید
        document.getElementById('btnConfirmYes').addEventListener('click', () => { if (confirmCb) confirmCb(); closeConfirm(); });
        document.getElementById('btnConfirmNo').addEventListener('click', closeConfirm);
        document.getElementById('confirmModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeConfirm(); });

        // افزودن دستی موبایل
        document.getElementById('mobFabAdd').addEventListener('click', () => {
            document.getElementById('addModal').classList.add('open');
            setTimeout(() => document.getElementById('mobAddInput').focus(), 350);
        });
        document.getElementById('mobAddBtn').addEventListener('click', () => {
            const inp = document.getElementById('mobAddInput');
            addManualName(inp.value);
            inp.value = '';
            document.getElementById('addModal').classList.remove('open');
        });
        document.getElementById('mobAddInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const inp = document.getElementById('mobAddInput');
                addManualName(inp.value);
                inp.value = '';
                document.getElementById('addModal').classList.remove('open');
            }
        });
        document.getElementById('addModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) document.getElementById('addModal').classList.remove('open');
        });

        // کشیدن و رها کردن فایل
        let dragC = 0;
        const dropOv = document.getElementById('dropOv');
        document.addEventListener('dragenter', (e) => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); dragC++; if (dragC === 1) dropOv.classList.add('active'); } });
        document.addEventListener('dragleave', (e) => { e.preventDefault(); dragC--; if (dragC <= 0) { dragC = 0; dropOv.classList.remove('active'); } });
        document.addEventListener('dragover', (e) => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
        document.addEventListener('drop', (e) => {
            if (e.dataTransfer.types.includes('Files')) {
                e.preventDefault(); dragC = 0; dropOv.classList.remove('active');
                const f = e.dataTransfer.files[0];
                if (!f) return;
                const ext = f.name.split('.').pop().toLowerCase();
                if (['xlsx','xls','csv'].includes(ext)) handleExcelUpload(f);
                else if (ext === 'json') handleJsonImport(f);
                else showToast('فرمت پشتیبانی نمی‌شود', 'error');
            }
        });

        // Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeMobTransferModal();
                closeConfirm();
                document.getElementById('addModal').classList.remove('open');
                if (document.getElementById('mobListView').classList.contains('active')) closeMobListView();
            }
        });
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
