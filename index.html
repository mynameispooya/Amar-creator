<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدیریت انتقال پرسنل</title>

    <!-- کتابخانه‌های مورد نیاز -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <!-- فونت فارسی -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- آیکون‌ها -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <style>
        /* ===== متغیرهای طراحی ===== */
        :root {
            --bg: #08090e;
            --bg-surface: #0f1119;
            --bg-card: #171a28;
            --bg-card-hover: #1f2337;
            --bg-input: #141722;
            --accent: #00d4aa;
            --accent-dim: rgba(0, 212, 170, 0.12);
            --accent-glow: rgba(0, 212, 170, 0.35);
            --amber: #f59e0b;
            --amber-dim: rgba(245, 158, 11, 0.12);
            --danger: #ef4444;
            --danger-dim: rgba(239, 68, 68, 0.12);
            --text: #e8eaf0;
            --text-secondary: #9ca3af;
            --text-muted: #5c6370;
            --border: #232740;
            --border-light: #2e3350;
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== ریست و پایه ===== */
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        html { font-size: 16px; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.7;
        }

        /* پس‌زمینه زنده */
        body::before {
            content: '';
            position: fixed;
            top: -30%; left: -10%;
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(0,212,170,0.06) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
            animation: floatBlob 20s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%; right: -10%;
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(245,158,11,0.04) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
            animation: floatBlob 25s ease-in-out infinite reverse;
        }

        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(5%, 8%) scale(1.05); }
            66% { transform: translate(-3%, -5%) scale(0.95); }
        }

        /* ===== هدر ===== */
        .app-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8, 9, 14, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 900px;
            margin: 0 auto;
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex; gap: 4px; align-items: center;
        }

        .icon-btn {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            border: none; border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 22px;
            position: relative;
        }
        .icon-btn:hover { background: var(--bg-card); color: var(--text); }
        .icon-btn:active { transform: scale(0.92); }

        .icon-btn .material-icons-round { font-size: 22px; }

        /* منوی کشویی */
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px); left: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            min-width: 200px;
            padding: 6px;
            z-index: 200;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            opacity: 0; transform: translateY(-8px) scale(0.96);
            pointer-events: none;
            transition: var(--transition);
        }
        .dropdown-menu.open {
            opacity: 1; transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .dropdown-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px;
            border: none; border-radius: 8px;
            background: transparent;
            color: var(--text);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            text-align: right;
        }
        .dropdown-item:hover { background: var(--bg-card-hover); }
        .dropdown-item .material-icons-round { font-size: 18px; color: var(--text-secondary); }
        .dropdown-item.danger { color: var(--danger); }
        .dropdown-item.danger .material-icons-round { color: var(--danger); }

        /* ===== محتوای اصلی ===== */
        .app-content {
            position: relative; z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
            min-height: calc(100vh - 65px);
        }

        .view { display: none; }
        .view.active { display: block; animation: viewFadeIn 0.35s ease; }

        @keyframes viewFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== آمار بالای صفحه ===== */
        .stats-bar {
            display: flex; gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }
        .stats-bar::-webkit-scrollbar { height: 0; }

        .stat-chip {
            flex-shrink: 0;
            display: flex; align-items: center; gap: 8px;
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 50px;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }
        .stat-chip .stat-value {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.95rem;
        }

        /* ===== کارت فایل اصلی ===== */
        .main-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(0,212,170,0.08) 100%);
            border: 1px solid rgba(0,212,170,0.2);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .main-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 120px; height: 120px;
            background: radial-gradient(circle, var(--accent-dim) 0%, transparent 70%);
            pointer-events: none;
        }
        .main-card:hover {
            border-color: rgba(0,212,170,0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,212,170,0.1);
        }
        .main-card:active { transform: translateY(0) scale(0.99); }

        .main-card-header {
            display: flex; align-items: center; justify-content: space-between;
        }
        .main-card-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 1rem; font-weight: 700;
        }
        .main-card-title .material-icons-round {
            font-size: 26px; color: var(--accent);
        }
        .main-card-count {
            font-size: 1.8rem; font-weight: 900;
            color: var(--accent);
            line-height: 1;
        }
        .main-card-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 6px;
            margin-right: 36px;
        }

        /* ===== گرید دسته‌بندی‌ها ===== */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .category-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .category-card:hover {
            border-color: var(--border-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .category-card:active { transform: translateY(0) scale(0.98); }

        .cat-color-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 6px;
            flex-shrink: 0;
        }
        .cat-name {
            display: flex; align-items: center;
            font-size: 0.82rem; font-weight: 600;
            color: var(--text);
            margin-bottom: 10px;
        }
        .cat-count {
            font-size: 1.5rem; font-weight: 900;
            line-height: 1;
        }
        .cat-count-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ===== حالت خالی ===== */
        .empty-state {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            padding: 60px 20px;
            min-height: 50vh;
        }
        .empty-state .material-icons-round {
            font-size: 64px;
            color: var(--text-muted);
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-size: 1.1rem; font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            max-width: 280px;
        }
        .empty-state .btn-primary {
            display: inline-flex; align-items: center; gap: 8px;
        }

        /* ===== نمای لیست ===== */
        .list-header {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 16px;
        }
        .list-back-btn {
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            color: var(--text);
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .list-back-btn:hover { background: var(--bg-card-hover); }
        .list-back-btn:active { transform: scale(0.92); }

        .list-title {
            font-size: 1rem; font-weight: 700;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-title-color {
            width: 6px; height: 22px;
            border-radius: 3px;
            display: inline-block;
            margin-left: 8px;
            flex-shrink: 0;
        }

        /* جستجو */
        .search-box {
            display: flex; align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0 12px;
            margin-bottom: 12px;
            transition: var(--transition);
        }
        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        .search-box .material-icons-round {
            font-size: 20px; color: var(--text-muted);
        }
        .search-box input {
            flex: 1;
            background: transparent; border: none; outline: none;
            color: var(--text);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.88rem;
            padding: 10px 10px;
        }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-clear {
            width: 28px; height: 28px;
            display: none; align-items: center; justify-content: center;
            border: none; border-radius: 50%;
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }
        .search-clear.visible { display: flex; }

        /* انتخاب همه */
        .select-all-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 4px;
            margin-bottom: 4px;
        }
        .select-all-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* ===== چک‌باکس سفارشی ===== */
        .custom-checkbox {
            position: relative;
            width: 22px; height: 22px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .custom-checkbox input {
            position: absolute;
            opacity: 0; width: 100%; height: 100%;
            cursor: pointer; z-index: 2;
            margin: 0;
        }
        .custom-checkbox .checkmark {
            position: absolute;
            top: 0; left: 0;
            width: 22px; height: 22px;
            border: 2px solid var(--border-light);
            border-radius: 6px;
            background: var(--bg-input);
            transition: var(--transition);
        }
        .custom-checkbox input:checked + .checkmark {
            background: var(--accent);
            border-color: var(--accent);
        }
        .custom-checkbox .checkmark::after {
            content: '';
            position: absolute;
            display: none;
            top: 3px; left: 7px;
            width: 5px; height: 10px;
            border: solid var(--bg);
            border-width: 0 2.5px 2.5px 0;
            transform: rotate(45deg);
        }
        .custom-checkbox input:checked + .checkmark::after { display: block; }

        /* آیتم لیست */
        .list-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            transition: var(--transition);
            animation: itemSlideIn 0.3s ease both;
        }
        .list-item:hover { background: var(--bg-card-hover); }
        .list-item.selected {
            border-color: rgba(0,212,170,0.3);
            background: rgba(0,212,170,0.06);
        }

        .item-name {
            flex: 1;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .item-index {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 600;
            min-width: 24px;
        }

        @keyframes itemSlideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .list-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.88rem;
        }
        .list-empty .material-icons-round {
            font-size: 48px; opacity: 0.3;
            display: block; margin: 0 auto 12px;
        }

        /* ===== نوار انتقال ===== */
        .transfer-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(15, 17, 25, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 14px 16px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 90;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .transfer-bar.visible { transform: translateY(0); }

        .transfer-bar-info {
            display: flex; align-items: center; gap: 8px;
        }
        .transfer-bar-count {
            background: var(--accent-dim);
            color: var(--accent);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 50px;
        }
        .transfer-bar-label {
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .btn-transfer {
            display: flex; align-items: center; gap: 6px;
            padding: 10px 22px;
            background: var(--accent);
            color: var(--bg);
            border: none; border-radius: var(--radius-sm);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.88rem; font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-transfer:hover { filter: brightness(1.1); box-shadow: 0 4px 20px var(--accent-glow); }
        .btn-transfer:active { transform: scale(0.96); }
        .btn-transfer .material-icons-round { font-size: 20px; }

        /* ===== مودال ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .modal-sheet {
            background: var(--bg-surface);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 8px 0 24px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.open .modal-sheet { transform: translateY(0); }

        .modal-handle {
            width: 40px; height: 4px;
            background: var(--border-light);
            border-radius: 2px;
            margin: 8px auto 16px;
        }

        .modal-title {
            font-size: 1rem; font-weight: 700;
            padding: 0 20px;
            margin-bottom: 12px;
        }

        .modal-option {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 20px;
            border: none; background: transparent;
            width: 100%; text-align: right;
            color: var(--text);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.9rem; font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-option:hover { background: var(--bg-card); }
        .modal-option:active { background: var(--bg-card-hover); }

        .modal-option-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .modal-option-count {
            margin-right: auto;
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .modal-cancel {
            display: block;
            width: calc(100% - 40px);
            margin: 16px auto 0;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-secondary);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.88rem; font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-cancel:hover { background: var(--bg-card); }

        /* ===== مودال تایید ===== */
        .confirm-sheet {
            background: var(--bg-surface);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 8px 24px 32px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.open .confirm-sheet { transform: translateY(0); }

        .confirm-message {
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.8;
            padding: 16px 0 24px;
        }
        .confirm-actions {
            display: flex; gap: 10px;
        }
        .confirm-actions button {
            flex: 1;
            padding: 12px;
            border: none; border-radius: var(--radius-sm);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.88rem; font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .confirm-actions button:active { transform: scale(0.97); }
        .btn-confirm-yes {
            background: var(--danger);
            color: #fff;
        }
        .btn-confirm-yes:hover { filter: brightness(1.1); }
        .btn-confirm-no {
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border) !important;
        }
        .btn-confirm-no:hover { background: var(--bg-card-hover); }

        /* ===== دکمه‌های اصلی ===== */
        .btn-primary {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 24px;
            background: var(--accent);
            color: var(--bg);
            border: none; border-radius: var(--radius-sm);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.88rem; font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-primary:hover { filter: brightness(1.1); box-shadow: 0 4px 20px var(--accent-glow); }
        .btn-primary:active { transform: scale(0.96); }

        /* ===== تست (Toast) ===== */
        .toast-container {
            position: fixed;
            top: 80px; left: 50%;
            transform: translateX(-50%);
            z-index: 500;
            display: flex; flex-direction: column;
            align-items: center; gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem; font-weight: 600;
            font-family: 'Vazirmatn', sans-serif;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s forwards;
            pointer-events: auto;
            max-width: 90vw;
            text-align: center;
        }
        .toast-success {
            background: rgba(0,212,170,0.15);
            color: var(--accent);
            border: 1px solid rgba(0,212,170,0.3);
        }
        .toast-error {
            background: var(--danger-dim);
            color: var(--danger);
            border: 1px solid rgba(239,68,68,0.3);
        }
        .toast-info {
            background: var(--amber-dim);
            color: var(--amber);
            border: 1px solid rgba(245,158,11,0.3);
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-16px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-16px) scale(0.95); }
        }

        /* ===== منطقه رها کردن ===== */
        .drop-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,212,170,0.08);
            backdrop-filter: blur(8px);
            z-index: 300;
            display: none;
            align-items: center; justify-content: center;
        }
        .drop-overlay.active { display: flex; }
        .drop-box {
            border: 3px dashed var(--accent);
            border-radius: 24px;
            padding: 60px 40px;
            text-align: center;
        }
        .drop-box .material-icons-round { font-size: 56px; color: var(--accent); }
        .drop-box p { font-size: 1rem; color: var(--accent); margin-top: 12px; font-weight: 600; }

        /* ===== پدینگ پایین برای نوار انتقال ===== */
        .list-body { padding-bottom: 80px; }

        /* ===== ریسپانسیو ===== */
        @media (min-width: 600px) {
            .category-grid { grid-template-columns: repeat(3, 1fr); }
            .app-content { padding: 24px; }
            .modal-sheet { border-radius: 20px; margin-bottom: 24px; }
        }

        @media (min-width: 900px) {
            .category-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
        }

        /* ===== حرکت کاهش‌یافته ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ===== اسکرول‌بار ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ===== هدر ===== -->
    <header class="app-header">
        <div class="header-row">
            <h1 class="app-title">مدیریت انتقال پرسنل</h1>
            <div class="header-actions">
                <button class="icon-btn" id="btnUpload" title="آپلود اکسل" aria-label="آپلود فایل اکسل">
                    <span class="material-icons-round">upload_file</span>
                </button>
                <div style="position:relative">
                    <button class="icon-btn" id="btnMore" title="بیشتر" aria-label="منوی بیشتر">
                        <span class="material-icons-round">more_vert</span>
                    </button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <button class="dropdown-item" id="btnExportZip">
                            <span class="material-icons-round">folder_zip</span>
                            خروجی ZIP (اکسل)
                        </button>
                        <button class="dropdown-item" id="btnExportJson">
                            <span class="material-icons-round">data_object</span>
                            خروجی JSON
                        </button>
                        <button class="dropdown-item" id="btnImportJson">
                            <span class="material-icons-round">upload</span>
                            ورود JSON
                        </button>
                        <button class="dropdown-item danger" id="btnClearAll">
                            <span class="material-icons-round">delete_sweep</span>
                            پاک کردن همه داده‌ها
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== محتوای اصلی ===== -->
    <div class="app-content">

        <!-- نمای خانه -->
        <div class="view active" id="homeView">
            <div class="stats-bar" id="statsBar"></div>
            <div id="homeContent"></div>
        </div>

        <!-- نمای لیست -->
        <div class="view" id="listView">
            <div class="list-header">
                <button class="list-back-btn" id="btnBack" aria-label="بازگشت">
                    <span class="material-icons-round">arrow_forward</span>
                </button>
                <span class="list-title-color" id="listColor"></span>
                <h2 class="list-title" id="listTitle"></h2>
            </div>
            <div class="search-box">
                <span class="material-icons-round">search</span>
                <input type="text" id="searchInput" placeholder="جستجو در اسامی..." aria-label="جستجو">
                <button class="search-clear" id="searchClear" aria-label="پاک کردن جستجو">
                    <span class="material-icons-round">close</span>
                </button>
            </div>
            <div class="select-all-bar">
                <span class="select-all-label" id="selectAllLabel"></span>
                <label class="custom-checkbox">
                    <input type="checkbox" id="selectAllCheckbox">
                    <span class="checkmark"></span>
                </label>
            </div>
            <div class="list-body" id="listBody"></div>
        </div>
    </div>

    <!-- ===== نوار انتقال ===== -->
    <div class="transfer-bar" id="transferBar">
        <div class="transfer-bar-info">
            <span class="transfer-bar-count" id="transferCount">0</span>
            <span class="transfer-bar-label">مورد انتخاب شده</span>
        </div>
        <button class="btn-transfer" id="btnTransfer">
            <span class="material-icons-round">swap_horiz</span>
            انتقال
        </button>
    </div>

    <!-- ===== مودال انتقال ===== -->
    <div class="modal-overlay" id="transferModal">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <h3 class="modal-title">انتقال به:</h3>
            <div id="transferOptions"></div>
            <button class="modal-cancel" id="btnCancelTransfer">انصراف</button>
        </div>
    </div>

    <!-- ===== مودال تایید ===== -->
    <div class="modal-overlay" id="confirmModal">
        <div class="confirm-sheet">
            <div class="modal-handle"></div>
            <p class="confirm-message" id="confirmMessage"></p>
            <div class="confirm-actions">
                <button class="btn-confirm-no" id="btnConfirmNo">خیر</button>
                <button class="btn-confirm-yes" id="btnConfirmYes">بله</button>
            </div>
        </div>
    </div>

    <!-- ===== تست ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== پوشش رها کردن ===== -->
    <div class="drop-overlay" id="dropOverlay">
        <div class="drop-box">
            <span class="material-icons-round">cloud_upload</span>
            <p>فایل اکسل را اینجا رها کنید</p>
        </div>
    </div>

    <!-- ===== ورودی‌های مخفی ===== -->
    <input type="file" id="fileExcel" accept=".xlsx,.xls,.csv" class="hidden">
    <input type="file" id="fileJson" accept=".json" class="hidden">

    <script>
        /* ======================================================
           ثابت‌ها و تنظیمات
        ====================================================== */
        const CATEGORIES = [
            { name: 'تولید برم 1', color: '#ff6b6b' },
            { name: 'تولید برم 2', color: '#fbbf24' },
            { name: 'تولید برم 3', color: '#34d399' },
            { name: 'تولید برم 4', color: '#60a5fa' },
            { name: 'سالن نشا', color: '#a78bfa' },
            { name: 'انتقالی به امیر', color: '#f472b6' },
            { name: 'انتقالی به گوزل', color: '#fb923c' },
            { name: 'ضد عفونی و سبد', color: '#2dd4bf' },
            { name: 'نخ سوزی و نخ ریسی', color: '#818cf8' }
        ];

        const MAIN_KEY = '__main__';
        const STORAGE_KEY = 'personnel_transfer_v2';

        /* ======================================================
           وضعیت (State)
        ====================================================== */
        let appState = { mainList: [], categories: {} };
        let currentView = 'home';
        let selectedItems = new Set();
        let searchQuery = '';
        let confirmCallback = null;

        /* ======================================================
           مدیریت وضعیت
        ====================================================== */
        function createEmptyState() {
            const state = { mainList: [], categories: {} };
            CATEGORIES.forEach(c => { state.categories[c.name] = []; });
            return state;
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState.mainList = Array.isArray(parsed.mainList) ? parsed.mainList : [];
                    appState.categories = parsed.categories || {};
                    // اطمینان از وجود تمام دسته‌بندی‌ها
                    CATEGORIES.forEach(c => {
                        if (!Array.isArray(appState.categories[c.name])) {
                            appState.categories[c.name] = [];
                        }
                    });
                } else {
                    appState = createEmptyState();
                }
            } catch (e) {
                console.error('خطا در بارگذاری داده‌ها:', e);
                appState = createEmptyState();
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (e) {
                console.error('خطا در ذخیره‌سازی:', e);
                showToast('خطا در ذخیره‌سازی! حافظه پر شده است. لطفاً خروجی JSON بگیرید.', 'error');
            }
        }

        /* ======================================================
           دریافت لیست فعلی
        ====================================================== */
        function getCurrentList() {
            if (currentView === MAIN_KEY) return appState.mainList;
            return appState.categories[currentView] || [];
        }

        function getCategoryColor(key) {
            if (key === MAIN_KEY) return '#00d4aa';
            const cat = CATEGORIES.find(c => c.name === key);
            return cat ? cat.color : '#6b7280';
        }

        function getTotalCount() {
            let total = appState.mainList.length;
            CATEGORIES.forEach(c => { total += (appState.categories[c.name] || []).length; });
            return total;
        }

        /* ======================================================
           رندر نمای خانه
        ====================================================== */
        function renderHome() {
            const homeContent = document.getElementById('homeContent');
            const statsBar = document.getElementById('statsBar');

            // آمار
            const total = getTotalCount();
            statsBar.innerHTML = `
                <div class="stat-chip">
                    <span>مجموع:</span>
                    <span class="stat-value">${total}</span>
                    <span>نفر</span>
                </div>
                <div class="stat-chip">
                    <span>فایل اصلی:</span>
                    <span class="stat-value">${appState.mainList.length}</span>
                </div>
                <div class="stat-chip">
                    <span>منتقل شده:</span>
                    <span class="stat-value">${total - appState.mainList.length}</span>
                </div>
            `;

            // اگر داده‌ای نیست
            if (appState.mainList.length === 0 && total === 0) {
                homeContent.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons-round">upload_file</span>
                        <h3>هنوز فایلی بارگذاری نشده</h3>
                        <p>برای شروع، فایل اکسل خود را آپلود کنید تا اسامی وارد سیستم شوند</p>
                        <button class="btn-primary" id="btnUploadEmpty">
                            <span class="material-icons-round">upload_file</span>
                            آپلود فایل اکسل
                        </button>
                    </div>
                `;
                document.getElementById('btnUploadEmpty').addEventListener('click', () => {
                    document.getElementById('fileExcel').click();
                });
                return;
            }

            // کارت فایل اصلی
            let html = `
                <div class="main-card" data-view="${MAIN_KEY}">
                    <div class="main-card-header">
                        <div class="main-card-title">
                            <span class="material-icons-round">description</span>
                            فایل اصلی
                        </div>
                        <div class="main-card-count">${appState.mainList.length}</div>
                    </div>
                    <div class="main-card-sub">نفر در لیست اصلی</div>
                </div>
            `;

            // گرید دسته‌بندی‌ها
            html += '<div class="category-grid">';
            CATEGORIES.forEach((cat, i) => {
                const count = (appState.categories[cat.name] || []).length;
                html += `
                    <div class="category-card" data-view="${cat.name}" style="animation-delay: ${i * 0.05}s">
                        <div class="cat-name">
                            <span class="cat-color-dot" style="background:${cat.color}"></span>
                            ${cat.name}
                        </div>
                        <div class="cat-count" style="color:${cat.color}">${count}</div>
                        <div class="cat-count-label">نفر</div>
                    </div>
                `;
            });
            html += '</div>';

            homeContent.innerHTML = html;

            // اتصال رویداد کلیک
            document.querySelectorAll('.main-card, .category-card').forEach(card => {
                card.addEventListener('click', () => {
                    const viewKey = card.dataset.view;
                    openListView(viewKey);
                });
            });
        }

        /* ======================================================
           رندر نمای لیست
        ====================================================== */
        function openListView(viewKey) {
            currentView = viewKey;
            selectedItems.clear();
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClear').classList.remove('visible');

            document.getElementById('homeView').classList.remove('active');
            document.getElementById('listView').classList.add('active');

            renderListView();
        }

        function renderListView() {
            const title = currentView === MAIN_KEY ? 'فایل اصلی' : currentView;
            const color = getCategoryColor(currentView);

            document.getElementById('listTitle').textContent = title;
            document.getElementById('listColor').style.background = color;

            renderListItems();
            updateTransferBar();
            updateSelectAllCheckbox();
        }

        function renderListItems() {
            const listBody = document.getElementById('listBody');
            const items = getCurrentList();
            const query = searchQuery.trim().toLowerCase();

            // فیلتر بر اساس جستجو
            const filtered = query
                ? items.filter(item => item.toLowerCase().includes(query))
                : items;

            if (filtered.length === 0) {
                const msg = items.length === 0
                    ? 'هنوز شخصی در این لیست نیست'
                    : 'نتیجه‌ای یافت نشد';
                listBody.innerHTML = `
                    <div class="list-empty">
                        <span class="material-icons-round">person_off</span>
                        ${msg}
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach((item, idx) => {
                const isSelected = selectedItems.has(item);
                html += `
                    <div class="list-item ${isSelected ? 'selected' : ''}" data-name="${escapeHtml(item)}" style="animation-delay: ${idx * 0.02}s">
                        <span class="item-index">${idx + 1}</span>
                        <label class="custom-checkbox" onclick="event.stopPropagation()">
                            <input type="checkbox" ${isSelected ? 'checked' : ''} data-name="${escapeHtml(item)}">
                            <span class="checkmark"></span>
                        </label>
                        <span class="item-name">${escapeHtml(item)}</span>
                    </div>
                `;
            });

            listBody.innerHTML = html;

            // اتصال رویداد چک‌باکس‌ها
            listBody.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const name = e.target.dataset.name;
                    if (e.target.checked) {
                        selectedItems.add(name);
                    } else {
                        selectedItems.delete(name);
                    }
                    // بروزرسانی استایل آیتم
                    const listItem = e.target.closest('.list-item');
                    if (listItem) {
                        listItem.classList.toggle('selected', e.target.checked);
                    }
                    updateTransferBar();
                    updateSelectAllCheckbox();
                });
            });

            // کلیک روی ردیف = تغییر چک‌باکس
            listBody.querySelectorAll('.list-item').forEach(item => {
                item.addEventListener('click', () => {
                    const cb = item.querySelector('input[type="checkbox"]');
                    if (cb) {
                        cb.checked = !cb.checked;
                        cb.dispatchEvent(new Event('change'));
                    }
                });
            });
        }

        function updateTransferBar() {
            const bar = document.getElementById('transferBar');
            const count = selectedItems.size;
            if (count > 0) {
                bar.classList.add('visible');
                document.getElementById('transferCount').textContent = count;
            } else {
                bar.classList.remove('visible');
            }
        }

        function updateSelectAllCheckbox() {
            const items = getCurrentList();
            const query = searchQuery.trim().toLowerCase();
            const filtered = query
                ? items.filter(item => item.toLowerCase().includes(query))
                : items;

            const allSelected = filtered.length > 0 && filtered.every(item => selectedItems.has(item));
            const selectAllCb = document.getElementById('selectAllCheckbox');
            selectAllCb.checked = allSelected;

            const label = document.getElementById('selectAllLabel');
            label.textContent = `انتخاب همه (${filtered.length} مورد)`;
        }

        /* ======================================================
           منطق انتقال
        ====================================================== */
        function openTransferModal() {
            if (selectedItems.size === 0) return;

            const modal = document.getElementById('transferModal');
            const optionsDiv = document.getElementById('transferOptions');

            let html = '';

            // گزینه فایل اصلی (اگر در فایل اصلی نیستیم)
            if (currentView !== MAIN_KEY) {
                html += `
                    <button class="modal-option" data-dest="${MAIN_KEY}">
                        <span class="modal-option-dot" style="background:#00d4aa"></span>
                        فایل اصلی
                        <span class="modal-option-count">${appState.mainList.length} نفر</span>
                    </button>
                `;
            }

            // گزینه‌های دسته‌بندی
            CATEGORIES.forEach(cat => {
                if (cat.name === currentView) return; // حذف مقصد فعلی
                const count = (appState.categories[cat.name] || []).length;
                html += `
                    <button class="modal-option" data-dest="${cat.name}">
                        <span class="modal-option-dot" style="background:${cat.color}"></span>
                        ${cat.name}
                        <span class="modal-option-count">${count} نفر</span>
                    </button>
                `;
            });

            optionsDiv.innerHTML = html;
            modal.classList.add('open');

            // اتصال رویداد
            optionsDiv.querySelectorAll('.modal-option').forEach(btn => {
                btn.addEventListener('click', () => {
                    const dest = btn.dataset.dest;
                    executeTransfer(dest);
                    closeTransferModal();
                });
            });
        }

        function closeTransferModal() {
            document.getElementById('transferModal').classList.remove('open');
        }

        function executeTransfer(destKey) {
            const items = Array.from(selectedItems);
            if (items.length === 0) return;

            // حذف از مبدا
            if (currentView === MAIN_KEY) {
                appState.mainList = appState.mainList.filter(item => !items.includes(item));
            } else {
                appState.categories[currentView] = appState.categories[currentView].filter(item => !items.includes(item));
            }

            // اضافه به مقصد (بدون تکرار)
            const destList = destKey === MAIN_KEY ? appState.mainList : appState.categories[destKey];
            const existingSet = new Set(destList);
            items.forEach(item => {
                if (!existingSet.has(item)) {
                    destList.push(item);
                }
            });

            // پاک‌سازی انتخاب‌ها
            selectedItems.clear();
            saveState();

            const destName = destKey === MAIN_KEY ? 'فایل اصلی' : destKey;
            showToast(`${items.length} مورد به "${destName}" منتقل شد`, 'success');

            // بروزرسانی نمای فعلی
            renderListView();
        }

        /* ======================================================
           پردازش فایل اکسل
        ====================================================== */
        async function processExcelFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const sheet = workbook.Sheets[firstSheetName];

                        // خواندن تمام داده‌ها به صورت آرایه دو بعدی
                        const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

                        // استخراج تمام مقادیر غیرخالی از تمام ستون‌ها
                        const allValues = [];
                        const seen = new Set(); // برای جلوگیری از تکرار

                        for (const row of jsonData) {
                            if (!Array.isArray(row)) continue;
                            for (const cell of row) {
                                const val = String(cell).trim();
                                if (val !== '' && val !== 'undefined' && val !== 'null') {
                                    if (!seen.has(val)) {
                                        seen.add(val);
                                        allValues.push(val);
                                    }
                                }
                            }
                        }

                        resolve(allValues);
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = () => reject(new Error('خطا در خواندن فایل'));
                reader.readAsArrayBuffer(file);
            });
        }

        async function handleExcelUpload(file) {
            try {
                const values = await processExcelFile(file);

                if (values.length === 0) {
                    showToast('فایل خالی است یا داده معتبری ندارد', 'error');
                    return;
                }

                // اگر داده‌ای از قبل وجود دارد، تایید بگیر
                if (appState.mainList.length > 0 || getTotalCount() > 0) {
                    showConfirm(
                        `با بارگذاری فایل جدید، ${getTotalCount()} نفر موجود در سیستم حذف و ${values.length} نفر جدید جایگزین می‌شوند. آیا مطمئن هستید؟`,
                        () => {
                            appState = createEmptyState();
                            appState.mainList = values;
                            saveState();
                            currentView = 'home';
                            showHomeView();
                            showToast(`${values.length} نام با موفقیت بارگذاری شد`, 'success');
                        }
                    );
                } else {
                    appState.mainList = values;
                    saveState();
                    currentView = 'home';
                    showHomeView();
                    showToast(`${values.length} نام با موفقیت بارگذاری شد`, 'success');
                }
            } catch (err) {
                console.error(err);
                showToast('خطا در پردازش فایل اکسل', 'error');
            }
        }

        /* ======================================================
           خروجی ZIP
        ====================================================== */
        async function exportZip() {
            if (getTotalCount() === 0) {
                showToast('داده‌ای برای خروجی وجود ندارد', 'info');
                return;
            }

            try {
                const zip = new JSZip();

                // فایل اصلی
                const mainWsData = [['نام و نام خانوادگی'], ...appState.mainList.map(n => [n])];
                const mainWs = XLSX.utils.aoa_to_sheet(mainWsData);
                const mainWb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(mainWb, mainWs, 'فایل اصلی');
                const mainBuf = XLSX.write(mainWb, { type: 'array', bookType: 'xlsx' });
                zip.file('فایل اصلی.xlsx', mainBuf);

                // فایل‌های دسته‌بندی
                CATEGORIES.forEach(cat => {
                    const names = appState.categories[cat.name] || [];
                    const wsData = [['نام و نام خانوادگی'], ...names.map(n => [n])];
                    const ws = XLSX.utils.aoa_to_sheet(wsData);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, cat.name);
                    const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
                    zip.file(`${cat.name}.xlsx`, buf);
                });

                const content = await zip.generateAsync({ type: 'blob' });
                const date = new Date().toISOString().slice(0, 10);
                saveAs(content, `انتقال_پرسنل_${date}.zip`);
                showToast('فایل ZIP با موفقیت ایجاد شد', 'success');
            } catch (err) {
                console.error(err);
                showToast('خطا در ایجاد فایل ZIP', 'error');
            }
        }

        /* ======================================================
           خروجی و ورود JSON
        ====================================================== */
        function exportJson() {
            if (getTotalCount() === 0) {
                showToast('داده‌ای برای خروجی وجود ندارد', 'info');
                return;
            }

            try {
                const json = JSON.stringify(appState, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const date = new Date().toISOString().slice(0, 10);
                saveAs(blob, `انتقال_پرسنل_${date}.json`);
                showToast('فایل JSON با موفقیت ایجاد شد', 'success');
            } catch (err) {
                console.error(err);
                showToast('خطا در ایجاد فایل JSON', 'error');
            }
        }

        function handleJsonImport(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);

                    // اعتبارسنجی
                    if (!data || typeof data !== 'object') {
                        showToast('فرمت فایل JSON نامعتبر است', 'error');
                        return;
                    }
                    if (!Array.isArray(data.mainList)) {
                        showToast('فایل JSON شامل mainList نیست', 'error');
                        return;
                    }
                    if (!data.categories || typeof data.categories !== 'object') {
                        showToast('فایل JSON شامل categories نیست', 'error');
                        return;
                    }

                    // بارگذاری
                    appState.mainList = data.mainList;
                    appState.categories = data.categories;

                    // اطمینان از وجود تمام دسته‌بندی‌ها
                    CATEGORIES.forEach(c => {
                        if (!Array.isArray(appState.categories[c.name])) {
                            appState.categories[c.name] = [];
                        }
                    });

                    saveState();
                    currentView = 'home';
                    showHomeView();
                    showToast('داده‌ها با موفقیت از JSON بارگذاری شد', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('خطا در خواندن فایل JSON', 'error');
                }
            };
            reader.readAsText(file);
        }

        /* ======================================================
           مودال تایید
        ====================================================== */
        function showConfirm(message, onConfirm) {
            confirmCallback = onConfirm;
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmModal').classList.add('open');
        }

        function closeConfirm() {
            document.getElementById('confirmModal').classList.remove('open');
            confirmCallback = null;
        }

        /* ======================================================
           تست (Toast)
        ====================================================== */
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 3200);
        }

        /* ======================================================
           تغییر نما
        ====================================================== */
        function showHomeView() {
            currentView = 'home';
            selectedItems.clear();
            document.getElementById('listView').classList.remove('active');
            document.getElementById('homeView').classList.add('active');
            document.getElementById('transferBar').classList.remove('visible');
            renderHome();
        }

        /* ======================================================
           ابزارها
        ====================================================== */
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        /* ======================================================
           راه‌اندازی و رویدادها
        ====================================================== */
        function init() {
            loadState();
            renderHome();
            setupEventListeners();
        }

        function setupEventListeners() {
            // آپلود اکسل
            document.getElementById('btnUpload').addEventListener('click', () => {
                document.getElementById('fileExcel').click();
            });

            document.getElementById('fileExcel').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) handleExcelUpload(file);
                e.target.value = ''; // ریست
            });

            // منوی بیشتر
            const moreBtn = document.getElementById('btnMore');
            const dropdown = document.getElementById('dropdownMenu');

            moreBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('open');
            });

            document.addEventListener('click', () => {
                dropdown.classList.remove('open');
            });

            dropdown.addEventListener('click', (e) => {
                e.stopPropagation();
            });

            // خروجی ZIP
            document.getElementById('btnExportZip').addEventListener('click', () => {
                dropdown.classList.remove('open');
                exportZip();
            });

            // خروجی JSON
            document.getElementById('btnExportJson').addEventListener('click', () => {
                dropdown.classList.remove('open');
                exportJson();
            });

            // ورود JSON
            document.getElementById('btnImportJson').addEventListener('click', () => {
                dropdown.classList.remove('open');
                document.getElementById('fileJson').click();
            });

            document.getElementById('fileJson').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) handleJsonImport(file);
                e.target.value = '';
            });

            // پاک کردن داده‌ها
            document.getElementById('btnClearAll').addEventListener('click', () => {
                dropdown.classList.remove('open');
                if (getTotalCount() === 0) {
                    showToast('داده‌ای برای پاک کردن وجود ندارد', 'info');
                    return;
                }
                showConfirm('آیا مطمئن هستید که تمام داده‌ها پاک شوند؟ این عمل قابل بازگشت نیست.', () => {
                    appState = createEmptyState();
                    saveState();
                    showHomeView();
                    showToast('تمام داده‌ها پاک شدند', 'success');
                });
            });

            // بازگشت
            document.getElementById('btnBack').addEventListener('click', () => {
                showHomeView();
            });

            // جستجو
            const searchInput = document.getElementById('searchInput');
            const searchClear = document.getElementById('searchClear');

            searchInput.addEventListener('input', () => {
                searchQuery = searchInput.value;
                searchClear.classList.toggle('visible', searchQuery.length > 0);
                selectedItems.clear();
                renderListItems();
                updateTransferBar();
                updateSelectAllCheckbox();
            });

            searchClear.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                searchClear.classList.remove('visible');
                selectedItems.clear();
                renderListItems();
                updateTransferBar();
                updateSelectAllCheckbox();
            });

            // انتخاب همه
            document.getElementById('selectAllCheckbox').addEventListener('change', (e) => {
                const items = getCurrentList();
                const query = searchQuery.trim().toLowerCase();
                const filtered = query
                    ? items.filter(item => item.toLowerCase().includes(query))
                    : items;

                if (e.target.checked) {
                    filtered.forEach(item => selectedItems.add(item));
                } else {
                    filtered.forEach(item => selectedItems.delete(item));
                }

                renderListItems();
                updateTransferBar();
            });

            // دکمه انتقال
            document.getElementById('btnTransfer').addEventListener('click', () => {
                openTransferModal();
            });

            // بستن مودال انتقال
            document.getElementById('btnCancelTransfer').addEventListener('click', closeTransferModal);
            document.getElementById('transferModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeTransferModal();
            });

            // مودال تایید
            document.getElementById('btnConfirmYes').addEventListener('click', () => {
                if (confirmCallback) confirmCallback();
                closeConfirm();
            });
            document.getElementById('btnConfirmNo').addEventListener('click', closeConfirm);
            document.getElementById('confirmModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeConfirm();
            });

            // کشیدن و رها کردن (Drag & Drop)
            let dragCounter = 0;
            const dropOverlay = document.getElementById('dropOverlay');

            document.addEventListener('dragenter', (e) => {
                e.preventDefault();
                dragCounter++;
                if (dragCounter === 1) dropOverlay.classList.add('active');
            });

            document.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dragCounter--;
                if (dragCounter === 0) dropOverlay.classList.remove('active');
            });

            document.addEventListener('dragover', (e) => {
                e.preventDefault();
            });

            document.addEventListener('drop', (e) => {
                e.preventDefault();
                dragCounter = 0;
                dropOverlay.classList.remove('active');
                const file = e.dataTransfer.files[0];
                if (file) {
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (['xlsx', 'xls', 'csv'].includes(ext)) {
                        handleExcelUpload(file);
                    } else if (ext === 'json') {
                        handleJsonImport(file);
                    } else {
                        showToast('فرمت فایل پشتیبانی نمی‌شود', 'error');
                    }
                }
            });

            // کلید Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeTransferModal();
                    closeConfirm();
                    if (currentView !== 'home') showHomeView();
                }
            });
        }

        // راه‌اندازی
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
